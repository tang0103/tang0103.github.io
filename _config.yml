# 仓库颜色主题
Repo_theme_light: Default theme # https://github.com/stats-organization/github-stats-extended/blob/master/packages/core/src/themes/README.md
repo_theme_dark: Dark theme # https://github.com/stats-organization/github-stats-extended/blob/master/packages/core/src/themes/README.md
# By default, addresses are split during compilation, so the HTML code does not contain any such split results.
# `user@host` and no `mailto:` for those who want to scrape data from harvesters. Clicking on this link will copy the data.
# Instead of opening an email client, I’m saving the content to the clipboard.
# See “Protecting email addresses from scrapers” in the docs/CUSTOMIZE.md file.
protect_email: false


# By default, the free public GitHub-profile service is disabled.
# (It seems that Vercel’s deployment configuration is set to respond with HTTP 402 / DEPLOYMENT_DISABLED. So, all trophies…
# Image 404 errors. The project itself remains open source and free to use – you can host it yourself.
# Please visit the external_services.github_profile_trophy_url link for more information about your instance. Then, set it accordingly.
# enabled: true. See the documentation at CUSTOMIZE.md for more details.
repo_trophies:
enabled: false
ThemeLight: Flat # https://github.com/ryo-ma/github-profile-trophy
theme_dark: gitdimmed # https://github.com/ryo-ma/github-profile-trophy


